name: Deploy to Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_HOST: ${{ vars.EC2_HOST }}

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'application/package-lock.json'

      - name: Install dependencies
        working-directory: ./application
        run: npm ci

      - name: Run tests
        working-directory: ./application
        run: npm test

      - name: Build application
        working-directory: ./application
        run: npm run build

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'application/package-lock.json'

      - name: Install dependencies
        working-directory: ./application
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: ./application
        env:
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push image to ECR
        env:
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        env:
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          EC2_HOST: ${{ env.EC2_HOST }}
        run: |
          echo "Deploying application to EC2 instance..."
          
          # Create deployment script
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          
          ECR_REGISTRY="$1"
          IMAGE_TAG="$2"
          
          echo "Deploying application from $ECR_REGISTRY/devops-assessment-prod-repository:$IMAGE_TAG"
          
          # Execute deployment on EC2 instance
          ssh -o StrictHostKeyChecking=no ubuntu@$EC2_HOST "
            # Login to ECR
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
            
            # Stop existing container
            docker stop devops-assessment-app 2>/dev/null || true
            docker rm devops-assessment-app 2>/dev/null || true
            
            # Pull new image
            docker pull $ECR_REGISTRY/devops-assessment-prod-repository:$IMAGE_TAG
            
            # Run new container
            docker run -d \
              --name devops-assessment-app \
              --restart unless-stopped \
              -p 3000:3000 \
              -v /opt/devops-assessment/logs:/app/logs \
              -e NODE_ENV=production \
              -e PORT=3000 \
              -e LOG_LEVEL=info \
              $ECR_REGISTRY/devops-assessment-prod-repository:$IMAGE_TAG
            
            echo 'Deployment completed successfully!'
            echo 'Application is running on port 3000'
          "
          
          # Health check
          echo "Performing health check..."
          sleep 10
          if curl -f http://$EC2_HOST:3000/health; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed!"
            exit 1
          fi
          EOF
          
          chmod +x deploy.sh
          ./deploy.sh $ECR_REGISTRY $IMAGE_TAG

      - name: Notify deployment status
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Deployment successful!"
            echo "🌐 Application available at: http://$EC2_HOST:3000"
            echo "🔍 Health check: http://$EC2_HOST:3000/health"
          else
            echo "❌ Deployment failed!"
            exit 1
          fi
